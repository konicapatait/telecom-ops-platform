# mfe-fraud pipeline. Generated by @platform/tools:mfe; job bodies live in ci/templates/app.gitlab-ci.yml.
# Included into the child pipeline only when mfe-fraud is affected, or when run on its own with APP=mfe-fraud.

mfe-fraud:lint:
  extends: .app-lint
  variables: { APP: mfe-fraud }

mfe-fraud:test:
  extends: .app-test
  variables: { APP: mfe-fraud }

mfe-fraud:build:
  extends: .app-build
  variables: { APP: mfe-fraud }

mfe-fraud:deploy:dev:
  extends: .app-deploy-dev
  variables: { APP: mfe-fraud }
  needs: ['mfe-fraud:build', 'mfe-fraud:lint', 'mfe-fraud:test']

mfe-fraud:smoke:dev:
  extends: .app-contract-smoke
  variables: { APP: mfe-fraud, DEPLOY_ENV: dev }
  needs: ['mfe-fraud:deploy:dev']

mfe-fraud:deploy:staging:
  extends: .app-deploy-staging
  variables: { APP: mfe-fraud }
  needs: ['mfe-fraud:build', 'mfe-fraud:smoke:dev']

mfe-fraud:deploy:prod:
  extends: .app-deploy-prod
  variables: { APP: mfe-fraud }
  needs: ['mfe-fraud:build', 'mfe-fraud:deploy:staging']

mfe-fraud:rollback:prod:
  extends: .app-rollback
  variables: { APP: mfe-fraud, DEPLOY_ENV: prod }
  needs: []
