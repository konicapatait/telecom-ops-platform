# mfe-cap-attachments pipeline. Generated by @platform/tools:mfe; job bodies live in ci/templates/app.gitlab-ci.yml.
# Included into the child pipeline only when mfe-cap-attachments is affected, or when run on its own with APP=mfe-cap-attachments.

mfe-cap-attachments:lint:
  extends: .app-lint
  variables: { APP: mfe-cap-attachments }

mfe-cap-attachments:test:
  extends: .app-test
  variables: { APP: mfe-cap-attachments }

mfe-cap-attachments:build:
  extends: .app-build
  variables: { APP: mfe-cap-attachments }

mfe-cap-attachments:deploy:dev:
  extends: .app-deploy-dev
  variables: { APP: mfe-cap-attachments }
  needs: ['mfe-cap-attachments:build', 'mfe-cap-attachments:lint', 'mfe-cap-attachments:test']

mfe-cap-attachments:smoke:dev:
  extends: .app-contract-smoke
  variables: { APP: mfe-cap-attachments, DEPLOY_ENV: dev }
  needs: ['mfe-cap-attachments:deploy:dev']

mfe-cap-attachments:deploy:staging:
  extends: .app-deploy-staging
  variables: { APP: mfe-cap-attachments }
  needs: ['mfe-cap-attachments:build', 'mfe-cap-attachments:smoke:dev']

mfe-cap-attachments:deploy:prod:
  extends: .app-deploy-prod
  variables: { APP: mfe-cap-attachments }
  needs: ['mfe-cap-attachments:build', 'mfe-cap-attachments:deploy:staging']

mfe-cap-attachments:rollback:prod:
  extends: .app-rollback
  variables: { APP: mfe-cap-attachments, DEPLOY_ENV: prod }
  needs: []
