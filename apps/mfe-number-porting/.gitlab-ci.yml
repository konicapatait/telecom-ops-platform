# mfe-number-porting pipeline. Generated by @platform/tools:mfe; job bodies live in ci/templates/app.gitlab-ci.yml.
# Included into the child pipeline only when mfe-number-porting is affected, or when run on its own with APP=mfe-number-porting.

mfe-number-porting:lint:
  extends: .app-lint
  variables: { APP: mfe-number-porting }

mfe-number-porting:test:
  extends: .app-test
  variables: { APP: mfe-number-porting }

mfe-number-porting:build:
  extends: .app-build
  variables: { APP: mfe-number-porting }

mfe-number-porting:deploy:dev:
  extends: .app-deploy-dev
  variables: { APP: mfe-number-porting }
  needs: ['mfe-number-porting:build', 'mfe-number-porting:lint', 'mfe-number-porting:test']

mfe-number-porting:smoke:dev:
  extends: .app-contract-smoke
  variables: { APP: mfe-number-porting, DEPLOY_ENV: dev }
  needs: ['mfe-number-porting:deploy:dev']

mfe-number-porting:deploy:staging:
  extends: .app-deploy-staging
  variables: { APP: mfe-number-porting }
  needs: ['mfe-number-porting:build', 'mfe-number-porting:smoke:dev']

mfe-number-porting:deploy:prod:
  extends: .app-deploy-prod
  variables: { APP: mfe-number-porting }
  needs: ['mfe-number-porting:build', 'mfe-number-porting:deploy:staging']

mfe-number-porting:rollback:prod:
  extends: .app-rollback
  variables: { APP: mfe-number-porting, DEPLOY_ENV: prod }
  needs: []
