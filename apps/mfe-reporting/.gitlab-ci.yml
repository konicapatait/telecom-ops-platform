# mfe-reporting pipeline. Generated by @platform/tools:mfe; job bodies live in ci/templates/app.gitlab-ci.yml.
# Included into the child pipeline only when mfe-reporting is affected, or when run on its own with APP=mfe-reporting.

mfe-reporting:lint:
  extends: .app-lint
  variables: { APP: mfe-reporting }

mfe-reporting:test:
  extends: .app-test
  variables: { APP: mfe-reporting }

mfe-reporting:build:
  extends: .app-build
  variables: { APP: mfe-reporting }

mfe-reporting:deploy:dev:
  extends: .app-deploy-dev
  variables: { APP: mfe-reporting }
  needs: ['mfe-reporting:build', 'mfe-reporting:lint', 'mfe-reporting:test']

mfe-reporting:smoke:dev:
  extends: .app-contract-smoke
  variables: { APP: mfe-reporting, DEPLOY_ENV: dev }
  needs: ['mfe-reporting:deploy:dev']

mfe-reporting:deploy:staging:
  extends: .app-deploy-staging
  variables: { APP: mfe-reporting }
  needs: ['mfe-reporting:build', 'mfe-reporting:smoke:dev']

mfe-reporting:deploy:prod:
  extends: .app-deploy-prod
  variables: { APP: mfe-reporting }
  needs: ['mfe-reporting:build', 'mfe-reporting:deploy:staging']

mfe-reporting:rollback:prod:
  extends: .app-rollback
  variables: { APP: mfe-reporting, DEPLOY_ENV: prod }
  needs: []
